<mat-card class="post-card glass-panel">
    <mat-card-header>
        <div mat-card-avatar class="post-avatar clickable"
            [style.background-image]="'url(' + (post.user.profilePicture || 'assets/avatar-placeholder.png') + ')'"
            (click)="$event.stopPropagation(); viewProfile()">
            <!-- Navigate to profile -->
        </div>
        <mat-card-title (click)="$event.stopPropagation(); viewProfile()" class="clickable">{{ post.user.userName
            }}</mat-card-title>
        <mat-card-subtitle>{{ post.createAt | date:'medium' }}</mat-card-subtitle>
        <span class="spacer"></span>
        <button mat-icon-button [matMenuTriggerFor]="menu" (click)="$event.stopPropagation()">
            <mat-icon>more_vert</mat-icon>
        </button>
        <mat-menu #menu="matMenu">
            <button mat-menu-item *ngIf="isOwner()" (click)="editPost()">
                <mat-icon>edit</mat-icon>
                <span>Edit</span>
            </button>
            <button mat-menu-item *ngIf="isOwner()" (click)="deletePost()">
                <mat-icon>delete</mat-icon>
                <span>Delete</span>
            </button>
            <button mat-menu-item (click)="openReportDialog()">
                <mat-icon>flag</mat-icon>
                <span>Report</span>
            </button>
        </mat-menu>
    </mat-card-header>

    <mat-card-content (click)="viewDetails()" class="clickable">
        <h3>{{ post.title }}</h3>
        <p>{{ post.content }}</p>
    </mat-card-content>

    @for (media of post.media; track $index) {
    <img mat-card-image *ngIf="media.type === 'IMAGE'" [src]="getMediaUrl(media.url)" alt="Post image"
        (click)="viewDetails()" class="clickable">
    <video mat-card-image *ngIf="media.type === 'VIDEO'" [src]="getMediaUrl(media.url)" controls></video>
    }

    <mat-card-actions align="start">
        <button mat-button (click)="$event.stopPropagation(); toggleLike()" [color]="liked() ? 'accent' : ''">
            <mat-icon>{{ liked() ? 'favorite' : 'favorite_border' }}</mat-icon>
            {{ likeCount() }}
        </button>
        <button mat-button (click)="$event.stopPropagation(); viewDetails()">
            <mat-icon>comment</mat-icon>
            {{ post.nbrOfComments || 0 }}
        </button>
        <span class="spacer"></span>
        <button mat-icon-button (click)="$event.stopPropagation()">
            <mat-icon>share</mat-icon>
        </button>
    </mat-card-actions>
</mat-card>
