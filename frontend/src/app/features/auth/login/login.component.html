<div class="auth-container">
    <div class="glass-panel auth-card">
        <div class="auth-header">
            <h2>Welcome Back</h2>
            <p>Sign in to continue to 01Blog</p>
        </div>

        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">

            <mat-form-field appearance="outline" class="full-width">
                <mat-label>Email or Username</mat-label>
                <input matInput formControlName="email">
                <mat-icon matSuffix>person</mat-icon>
                <mat-error *ngIf="loginForm.get('email')?.hasError('required')">Identifier is required</mat-error>
            </mat-form-field>

            <mat-form-field appearance="outline" class="full-width">
                <mat-label>Password</mat-label>
                <input matInput [type]="hidePassword ? 'password' : 'text'" formControlName="password">
                <button mat-icon-button matSuffix type="button" (click)="hidePassword = !hidePassword">
                    <mat-icon>{{hidePassword ? 'visibility_off' : 'visibility'}}</mat-icon>
                </button>
                <mat-error *ngIf="loginForm.get('password')?.hasError('required')">Password is required</mat-error>
            </mat-form-field>

            <div class="error-message" *ngIf="errorMessage()">
                {{ errorMessage() }}
            </div>

            <button mat-flat-button color="primary" class="full-width submit-btn" type="submit"
                [disabled]="loginForm.invalid">
                Sign In
            </button>

            <div class="auth-footer">
                <p>Don't have an account? <a routerLink="/register">Create one</a></p>
            </div>
        </form>
    </div>
</div>
