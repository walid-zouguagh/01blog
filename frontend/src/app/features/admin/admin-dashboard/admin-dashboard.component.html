<div class="admin-container glass-panel">
    <h1>Admin Dashboard</h1>

    <mat-tab-group>
        <mat-tab label="Users">
            <div class="table-container">
                <table mat-table [dataSource]="users()" class="full-width">

                    <ng-container matColumnDef="username">
                        <th mat-header-cell *matHeaderCellDef> Username </th>
                        <td mat-cell *matCellDef="let user"> {{user.userName}} </td>
                    </ng-container>

                    <ng-container matColumnDef="email">
                        <th mat-header-cell *matHeaderCellDef> Email </th>
                        <td mat-cell *matCellDef="let user"> {{user.email}} </td>
                    </ng-container>

                    <ng-container matColumnDef="role">
                        <th mat-header-cell *matHeaderCellDef> Role </th>
                        <td mat-cell *matCellDef="let user"> {{user.role}} </td>
                    </ng-container>

                    <ng-container matColumnDef="actions">
                        <th mat-header-cell *matHeaderCellDef> Actions </th>
                        <td mat-cell *matCellDef="let user">
                            <button mat-icon-button color="warn" (click)="deleteUser(user.id)"
                                [disabled]="user.role === 'ADMIN'">
                                <mat-icon>delete</mat-icon>
                            </button>
                        </td>
                    </ng-container>

                    <tr mat-header-row *matHeaderRowDef="displayedUserColumns"></tr>
                    <tr mat-row *matRowDef="let row; columns: displayedUserColumns;"></tr>
                </table>
            </div>
        </mat-tab>

        <mat-tab label="Posts">
            <div class="table-container">
                <table mat-table [dataSource]="posts()" class="full-width">

                    <ng-container matColumnDef="user">
                        <th mat-header-cell *matHeaderCellDef> User </th>
                        <td mat-cell *matCellDef="let post"> {{post.user.username}} </td>
                    </ng-container>

                    <ng-container matColumnDef="content">
                        <th mat-header-cell *matHeaderCellDef> Description </th>
                        <td mat-cell *matCellDef="let post"> {{post.description | slice:0:50}}... </td>
                    </ng-container>

                    <ng-container matColumnDef="date">
                        <th mat-header-cell *matHeaderCellDef> Date </th>
                        <td mat-cell *matCellDef="let post"> {{post.createdAt | date:'short'}} </td>
                    </ng-container>

                    <ng-container matColumnDef="actions">
                        <th mat-header-cell *matHeaderCellDef> Actions </th>
                        <td mat-cell *matCellDef="let post">
                            <button mat-icon-button color="warn">
                                <mat-icon>delete</mat-icon>
                            </button>
                        </td>
                    </ng-container>

                    <tr mat-header-row *matHeaderRowDef="displayedPostColumns"></tr>
                    <tr mat-row *matRowDef="let row; columns: displayedPostColumns;"></tr>
                </table>
            </div>
        </mat-tab>
        <mat-tab label="Reports">
            <div class="table-container">
                <table mat-table [dataSource]="reports()" class="full-width">
                    <ng-container matColumnDef="id">
                        <th mat-header-cell *matHeaderCellDef> ID </th>
                        <td mat-cell *matCellDef="let report"> {{report.id}} </td>
                    </ng-container>

                    <ng-container matColumnDef="reason">
                        <th mat-header-cell *matHeaderCellDef> Reason </th>
                        <td mat-cell *matCellDef="let report"> {{report.reason || 'N/A'}} </td>
                    </ng-container>

                    <ng-container matColumnDef="actions">
                        <th mat-header-cell *matHeaderCellDef> Actions </th>
                        <td mat-cell *matCellDef="let report">
                            <!-- Actions to resolve or view details -->
                            <button mat-button>View</button>
                        </td>
                    </ng-container>

                    <tr mat-header-row *matHeaderRowDef="displayedReportColumns"></tr>
                    <tr mat-row *matRowDef="let row; columns: displayedReportColumns;"></tr>
                </table>
            </div>
        </mat-tab>
    </mat-tab-group>
</div>
